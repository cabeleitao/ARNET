<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARNET Finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f14;color:#e8eaf0;font-family:'DM Mono',monospace;padding:20px;min-height:100vh}
#loader{position:fixed;inset:0;background:#0d0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999}
.spin{width:34px;height:34px;border:2px solid rgba(255,255,255,.1);border-top-color:#2dce89;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none}
h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:700}
.sub{font-size:11px;color:#7a7f94;margin-top:3px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.badge{display:flex;align-items:center;gap:6px;background:rgba(45,206,137,.12);border:1px solid rgba(45,206,137,.2);border-radius:20px;padding:4px 12px;font-size:10px;color:#2dce89}
.dot{width:6px;height:6px;border-radius:50%;background:#2dce89;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.divider{border:none;border-top:1px solid rgba(255,255,255,.07);margin:18px 0}
.sec{font-family:'Syne',sans-serif;font-size:10px;font-weight:500;color:#7a7f94;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
/* KPIs */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:20px}
.kpi{background:#141720;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kg::before{background:#2dce89}.kb::before{background:#4d9ef7}.ks::before{background:#9b8ff7}
.ka::before{background:#ffbe3d}.kr::before{background:#f5365c}
.klbl{font-size:10px;color:#7a7f94;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kval{font-family:'Syne',sans-serif;font-size:20px;font-weight:700}
.kval.pos{color:#2dce89}.kval.neg{color:#f5365c}.kval.bl{color:#4d9ef7}
.ksub{font-size:10px;color:#7a7f94;margin-top:3px}
.trend{font-size:9px;padding:2px 5px;border-radius:8px;margin-left:4px;font-weight:500}
.tup{background:rgba(45,206,137,.15);color:#2dce89}
.tdn{background:rgba(245,54,92,.12);color:#f5365c}
/* MES SELECTOR */
.mes-ctrl{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mes-ctrl label{font-size:10px;color:#7a7f94;text-transform:uppercase;letter-spacing:.06em}
select,input[type=date]{background:#1c2030;border:1px solid rgba(255,255,255,.13);color:#e8eaf0;border-radius:6px;padding:5px 10px;font-size:11px;font-family:'DM Mono',monospace}
select:focus,input:focus{outline:none;border-color:#2dce89}
select option{background:#1c2030}
.btn{background:transparent;border:1px solid rgba(255,255,255,.13);color:#e8eaf0;border-radius:6px;padding:5px 12px;font-size:11px;font-family:'DM Mono',monospace;cursor:pointer}
.btn:hover{border-color:#2dce89;color:#2dce89}
/* BARS */
.brow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.blbl{font-size:10px;color:#7a7f94;width:72px;text-align:right;flex-shrink:0}
.btrack{flex:1;background:#1c2030;border-radius:3px;height:15px;overflow:hidden}
.bfill{height:100%;border-radius:3px}
.bamt{font-size:10px;min-width:90px;text-align:right}
/* KANBAN */
.kscroll{overflow-x:auto;padding-bottom:6px}
.kanban{display:flex;gap:8px;min-width:580px}
.kcol{flex:1;min-width:105px}
.khead{font-size:10px;padding:5px 8px;background:#1c2030;border:1px solid rgba(255,255,255,.07);border-radius:7px;margin-bottom:7px;display:flex;align-items:center;gap:5px;color:#7a7f94}
.kdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.kcard{background:#141720;border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:8px 10px;margin-bottom:6px;min-height:46px}
.kcard.empty{opacity:.2}
.krub{font-size:9px;color:#7a7f94;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.kamt{font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
.kneto{border-radius:7px;padding:7px 10px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;text-align:center;margin-top:4px}
/* CHART */
.cctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cctrls label{font-size:10px;color:#7a7f94}
.cw{position:relative;width:100%;height:210px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.leg span{display:flex;align-items:center;gap:5px;font-size:10px;color:#7a7f94}
.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0}

.tctrl input{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:10px}
th{color:#7a7f94;font-weight:500;padding:6px 9px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;text-transform:uppercase;letter-spacing:.06em}
td{padding:6px 9px;border-bottom:1px solid rgba(255,255,255,.07)}
tr:hover td{background:#1c2030}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:20px;font-weight:500}
.ti{background:rgba(45,206,137,.15);color:#2dce89}
.tb{background:rgba(77,158,247,.15);color:#4d9ef7}
.ts{background:rgba(155,143,247,.15);color:#9b8ff7}
.tp{background:rgba(255,190,61,.15);color:#ffbe3d}
.tpa{background:rgba(245,54,92,.12);color:#f5365c}
.to{background:rgba(122,127,148,.15);color:#7a7f94}
.footer{margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer span{font-size:10px;color:#7a7f94}

</head>

<div class="leg" id="leg"></div>

<hr class="divider">
<p class="sec">Movimientos</p>
<div class="tctrl">

</div>
<table><thead><tr><th>Mes</th><th>Rubro</th><th>Importe</th></tr></thead><tbody id="tbody"></tbody></table>

<div class="footer">
  <span id="fcnt"></span>
  <button class="btn" onclick="fetchData()">↻ Actualizar</button>
</div>
</div>

let LIVE = [];       // agregado por mes desde Drive
let LIVE_DAILY = []; // filas diarias desde Drive (con fecha)
let ALL = [];
let SEL_MES = null;  // {y,m} seleccionado manualmente
let lineChart = null;

// ── UTILS ──
function fmt(n){
  const a=Math.abs(n);
  if(a>=1000000) return (n<0?'-':'')+'$'+(a/1e6).toFixed(2)+'M';
  if(a>=1000) return (n<0?'-':'')+'$'+(a/1e3).toFixed(0)+'K';
  return (n<0?'-':'')+'$'+a.toFixed(0);
}
function fmtFull(n){ return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('es-AR'); }
function sumCat(rows,cat){ return rows.filter(function(r){return r.cat===cat;}).reduce(function(s,r){return s+r.amt;},0); }
function getMes(y,m){ return ALL.filter(function(r){return r.y===y&&r.m===m;}); }
function prevMes(y,m){ return m===1?{y:y-1,m:12}:{y:y,m:m-1}; }

// ── MERGE ──
function mergeData(){
  var liveMeses = {};
  LIVE.forEach(function(r){ liveMeses[r.y+'_'+r.m]=true; });
  var base = HIST.filter(function(r){ return !liveMeses[r.y+'_'+r.m]; });
  ALL = base.concat(LIVE).sort(function(a,b){ return a.y!==b.y?a.y-b.y:a.m-b.m; });
  console.log('ALL months:', [...new Set(ALL.map(function(r){return r.y+'/'+r.m;}))].join(', '));
}

// ── FETCH ──
async function fetchData(){
  try{
    document.getElementById('loader').style.display='flex';
    document.getElementById('app').style.display='none';
    var res = await fetch(API);
    var json = await res.json();
    if(json.error) throw new Error(json.error);

    LIVE_DAILY = json.rows.filter(function(r){return r.amt!==0;});

    // Aggregate into monthly for KPIs/chart
    var map = {};
    LIVE_DAILY.forEach(function(r){
      var k = r.y+'_'+r.m+'_'+r.cat;
      if(!map[k]) map[k]={y:r.y,m:r.m,cat:r.cat,amt:0};
      map[k].amt += r.amt;
    });
    LIVE = Object.keys(map).map(function(k){return map[k];});

    mergeData();
    fillSelect(getActive());
    var d = new Date(json.updated);
    document.getElementById('sync').textContent = 'Última sync: '+d.toLocaleString('es-AR');
    render();
    document.getElementById('loader').style.display='none';
    document.getElementById('app').style.display='block';
  }catch(e){
    document.getElementById('loader').innerHTML = '<div style="color:#f5365c;text-align:center"><p style="font-size:22px">⚠</p><p style="font-size:12px;margin-top:8px">'+e.message+'</p><button class="btn" style="margin-top:12px" onclick="fetchData()">Reintentar</button></div>';
  }
}

// ── ACTIVE MES ──
function getLatest(){
  var best={y:2024,m:5};
  ALL.filter(function(r){return r.cat==='Ingresos'&&r.amt>0;}).forEach(function(r){
    if(r.y>best.y||(r.y===best.y&&r.m>best.m)) best={y:r.y,m:r.m};
  });
  return best;
}
function getActive(){ return SEL_MES||getLatest(); }

// ── RENDER ──

  var act = getActive();
  fillSelect(act);
  renderKPIs(act);
  renderBars(act);
  renderKanban(act);
  renderChart();
  renderTable();
  document.getElementById('fcnt').textContent = ALL.length+' registros · mes: '+MNAMES[act.m-1]+' '+act.y;
}

function fillSelect(act){
  var sel = document.getElementById('selMes');
  var seen = {};
  var meses = [];
  // Use ALL if populated, otherwise fall back to HIST
  var source = ALL.length > 0 ? ALL : HIST;
  source.forEach(function(r){
    var k = r.y+'-'+(r.m<10?'0':'')+r.m;
    if(!seen[k]){seen[k]=true;meses.push({k:k,y:r.y,m:r.m});}
  });
  meses.sort(function(a,b){ return b.y!==a.y ? b.y-a.y : b.m-a.m; });
  var actKey = act.y+'-'+(act.m<10?'0':'')+act.m;
  var html='';
  meses.forEach(function(x){
    html += '<option value="'+x.k+'"'+(x.k===actKey?' selected':'')+'>'+MNAMES[x.m-1]+' '+x.y+'</option>';
  });
  sel.innerHTML = html;
  console.log('fillSelect: '+meses.length+' meses, activo='+actKey);
}

function onMesChange(){
  var val = document.getElementById('selMes').value;
  var parts = val.split('-');
  SEL_MES = {y:parseInt(parts[0]),m:parseInt(parts[1])};
  var act = SEL_MES;
  document.getElementById('tit-bars').textContent = MNAMES[act.m-1]+' '+act.y;
  document.getElementById('tit-kan').textContent = MNAMES[act.m-1]+' '+act.y;
  renderKPIs(act);
  renderBars(act);
  renderKanban(act);
}

// ── KPIs ──
function renderKPIs(act){
  var rows = getMes(act.y,act.m);
  var prev = prevMes(act.y,act.m);
  var rowsP = getMes(prev.y,prev.m);
  var ing=sumCat(rows,'Ingresos'), baj=Math.abs(sumCat(rows,'Bajadas'));
  var sue=sumCat(rows,'Sueldos'), pub=sumCat(rows,'Publicidad'), pan=sumCat(rows,'Panel'), otr=sumCat(rows,'otros');
  var gasto=sue+pub+pan+otr;
  var neto=ing+baj+gasto;
  var margen=ing>0?Math.round(baj/ing*1000)/10:0;
  var ingP=sumCat(rowsP,'Ingresos');
  var netoP=sumCat(rowsP,'Ingresos')+Math.abs(sumCat(rowsP,'Bajadas'))+sumCat(rowsP,'Sueldos')+sumCat(rowsP,'Publicidad')+sumCat(rowsP,'Panel')+sumCat(rowsP,'otros');
  var dIng=ingP>0?Math.round((ing-ingP)/ingP*1000)/10:0;
  var dNeto=Math.abs(netoP)>0?Math.round((neto-netoP)/Math.abs(netoP)*1000)/10:0;
  var label=MSHORT[act.m-1]+' '+act.y;
  var prevLabel=MSHORT[prev.m-1];

  document.getElementById('kpis').innerHTML =
    kpi('kg','Ingresos '+label,fmt(ing),'pos',dIng,'vs '+prevLabel+': '+fmt(ingP))+
    kpi('kb','Bajadas · ganancia',fmt(baj),'bl',null,margen+'% sobre ingresos')+
    kpi('ks','Sueldos',fmt(sue),'neg',null,'personal')+
    kpi('ka','Publicidad',fmt(pub),pub>=0?'pos':'neg',null,'marketing')+
    kpi('kr','Panel + Otros',fmt(pan+otr),'neg',null,'infraestructura')+
    kpi(neto>=0?'kg':'kr','Resultado neto',fmt(neto),neto>=0?'pos':'neg',dNeto,'ing+gcia-gastos');
}

function kpi(cls,label,val,vcls,delta,sub){
  var tr='';
  if(delta!==null){
    var up=delta>=0;
    tr='<span class="trend '+(up?'tup':'tdn')+'">'+(up?'↑':'↓')+Math.abs(delta)+'%</span>';
  }
  return '<div class="kpi '+cls+'"><div class="klbl">'+label+'</div><div class="kval '+vcls+'">'+val+tr+'</div><div class="ksub">'+sub+'</div></div>';
}

// ── BARS ──
function renderBars(act){
  document.getElementById('tit-bars').textContent = MNAMES[act.m-1]+' '+act.y;
  var rows=getMes(act.y,act.m);
  var vals=RUBROS.map(function(c){return{cat:c,val:sumCat(rows,c)};}).filter(function(x){return x.val!==0;});
  var maxA=Math.max.apply(null,vals.map(function(x){return Math.abs(x.val);}));
  var html='';
  vals.forEach(function(x){
    var isBaj=x.cat==='Bajadas';
    var disp=isBaj?Math.abs(x.val):x.val;
    var col=isBaj?'#4d9ef7':disp>=0?'#2dce89':'#f5365c';
    var pct=maxA?Math.round(Math.abs(x.val)/maxA*1000)/10:0;
    html+='<div class="brow"><span class="blbl">'+x.cat+'</span><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:'+BARCOL[x.cat]+'"></div></div><span class="bamt" style="color:'+col+'">'+fmtFull(disp)+'</span></div>';
  });
  document.getElementById('bars').innerHTML=html;
}

// ── KANBAN ──
function renderKanban(act){
  document.getElementById('tit-kan').textContent = MNAMES[act.m-1]+' '+act.y;
  var dim=new Date(act.y,act.m,0).getDate();
  var ranges=[[1,7],[8,14],[15,21],[22,28]];
  if(dim>28) ranges.push([29,dim]);

  // Check if we have daily rows for this month
  var daily=LIVE_DAILY.filter(function(r){return r.y===act.y&&r.m===act.m;});
  var hasDailyData=daily.length>0;

  var html='';
  ranges.forEach(function(range){
    var s=range[0], e=Math.min(range[1],dim);
    var wv={};
    RUBROS.forEach(function(c){wv[c]=0;});

    if(hasDailyData){
      daily.forEach(function(r){
        var day=parseInt(r.fecha.split('/')[0]);
        if(day>=s&&day<=e&&wv[r.cat]!==undefined) wv[r.cat]+=r.amt;
      });
    } else if(s===1){
      // Monthly data: show totals only in week 1
      var rows=getMes(act.y,act.m);
      RUBROS.forEach(function(c){wv[c]=sumCat(rows,c);});
    }

    var ing=wv['Ingresos'], baj=Math.abs(wv['Bajadas']);
    var gasto=wv['Sueldos']+wv['Publicidad']+wv['Panel']+wv['otros'];
    var neto=ing+baj+gasto;
    var hasData=RUBROS.some(function(c){return wv[c]!==0;});
    var dotCol=hasData?(neto>=0?'#2dce89':'#f5365c'):'#5a5f72';

    html+='<div class="kcol"><div class="khead"><span class="kdot" style="background:'+dotCol+'"></span>'+s+'–'+e+'</div>';
    RUBROS.forEach(function(cat){
      var v=wv[cat], isBaj=cat==='Bajadas', disp=isBaj?Math.abs(v):v;
      var col=isBaj?'#4d9ef7':v>=0?'#2dce89':'#f5365c';
      if(!v){
        html+='<div class="kcard empty"><div class="krub">'+cat+'</div><div class="kamt" style="color:#7a7f94">—</div></div>';
      } else {
        html+='<div class="kcard"><div class="krub">'+cat+(isBaj?' ✓':'')+'</div><div class="kamt" style="color:'+col+'">'+fmt(disp)+'</div></div>';
      }
    });
    if(hasData){
      html+='<div class="kneto" style="background:'+(neto>=0?'rgba(45,206,137,.08)':'rgba(245,54,92,.08)')+';border:1px solid '+(neto>=0?'rgba(45,206,137,.2)':'rgba(245,54,92,.2)')+';color:'+(neto>=0?'#2dce89':'#f5365c')+'">'+fmt(neto)+'</div>';
    }
    html+='</div>';
  });
  document.getElementById('kanban').innerHTML=html;
}

// ── CHART ──
function renderChart(){
  var from=new Date(document.getElementById('dFrom').value);
  var to=new Date(document.getElementById('dTo').value);
  to.setHours(23,59,59);
  var mode=document.getElementById('cMode').value;
  var rubro=document.getElementById('cRubro').value;

  var filtered=ALL.filter(function(r){
    var dt=new Date(r.y,r.m-1,1);
    return dt>=from&&dt<=to;
  });

  var mkeys=[];
  var seen={};
  filtered.forEach(function(r){
    var k=r.y+'-'+(r.m<10?'0':'')+r.m;
    if(!seen[k]){seen[k]=true;mkeys.push(k);}
  });
  mkeys.sort();

  var datasets=[];
  function addDs(label,color,dash,data){
    datasets.push({label:label,data:data,borderColor:color,backgroundColor:color.replace('rgb','rgba').replace(')',', .08)'),fill:true,tension:.35,pointRadius:3,pointBackgroundColor:color,borderWidth:2,borderDash:dash||[]});
  }

  function getMonthVal(mk,rb){
    var parts=mk.split('-');
    var y=parseInt(parts[0]),m=parseInt(parts[1]);
    var mr=filtered.filter(function(r){return r.y===y&&r.m===m;});
    if(rb==='I') return sumCat(mr,'Ingresos');
    if(rb==='B') return Math.abs(sumCat(mr,'Bajadas'));
    if(rb==='N'){
      var ing=sumCat(mr,'Ingresos'),baj=Math.abs(sumCat(mr,'Bajadas'));
      var g=sumCat(mr,'Sueldos')+sumCat(mr,'Publicidad')+sumCat(mr,'Panel')+sumCat(mr,'otros');
      return ing+baj+g;
    }
    return 0;
  }

  if(rubro==='IB'){
    var cumI=0,cumB=0;
    var dI=[],dB=[];
    mkeys.forEach(function(mk){
      var vi=getMonthVal(mk,'I'), vb=getMonthVal(mk,'B');
      if(mode==='acum'){cumI+=vi;cumB+=vb;dI.push(Math.round(cumI/1e6*100)/100);dB.push(Math.round(cumB/1e6*100)/100);}
      else{dI.push(Math.round(vi/1e6*100)/100);dB.push(Math.round(vb/1e6*100)/100);}
    });
    addDs('Ingresos','#2dce89',[],dI);
    addDs('Bajadas','#4d9ef7',[5,4],dB);
  } else {
    var rb2=rubro==='N'?'N':rubro;
    var cum=0,d=[];
    mkeys.forEach(function(mk){
      var v=getMonthVal(mk,rb2);
      if(mode==='acum'){cum+=v;d.push(Math.round(cum/1e6*100)/100);}
      else d.push(Math.round(v/1e6*100)/100);
    });
    var col=rubro==='N'?'#2dce89':'#4d9ef7';
    addDs(rubro==='N'?'Resultado neto':'Bajadas',col,[],d);
  }

  var labels=mkeys.map(function(k){
    var parts=k.split('-');
    return MSHORT[parseInt(parts[1])-1]+' '+parts[0].slice(2);
  });

  if(lineChart) lineChart.destroy();
  lineChart=new Chart(document.getElementById('chart'),{
    type:'line',data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': $'+ctx.parsed.y.toFixed(2)+'M';}}}},
      scales:{
        x:{ticks:{color:'#7a7f94',font:{size:9},autoSkip:true,maxTicksLimit:18,maxRotation:45},grid:{display:false}},
        y:{ticks:{color:'#7a7f94',font:{size:9},callback:function(v){return '$'+v+'M';}},grid:{color:'rgba(255,255,255,.05)'}}
      }
    }
  });

  var legHtml='';
  datasets.forEach(function(ds){
    legHtml+='<span><span class="ld" style="background:'+ds.borderColor+'"></span>'+ds.label+'</span>';
  });
  document.getElementById('leg').innerHTML=legHtml;
}

// ── TABLE ──
function renderTable(){
  var q=(document.getElementById('tSrch').value||'').toLowerCase();
  var cat=document.getElementById('tCat').value;
  var yr=document.getElementById('tAno').value;
  var rows=ALL.slice().reverse().filter(function(r){
    if(cat&&r.cat!==cat) return false;
    if(yr&&String(r.y)!==yr) return false;
    if(q&&!(MNAMES[r.m-1].toLowerCase().indexOf(q)>=0||r.cat.toLowerCase().indexOf(q)>=0||String(r.y).indexOf(q)>=0)) return false;
    return true;
  });
  var html='';
  rows.forEach(function(r){
    var isBaj=r.cat==='Bajadas', disp=isBaj?Math.abs(r.amt):r.amt;
    var col=isBaj?'#4d9ef7':disp>=0?'#2dce89':'#f5365c';
    html+='<tr><td>'+MSHORT[r.m-1]+' '+r.y+'</td><td><span class="tag '+TAGCLS[r.cat]+'">'+r.cat+(isBaj?' ✓':'')+'</span></td><td style="color:'+col+';font-weight:500">'+fmtFull(disp)+'</td></tr>';
  });
  document.getElementById('tbody').innerHTML=html||'<tr><td colspan="3" style="color:#7a7f94;text-align:center">Sin resultados</td></tr>';
}

// ── INIT ──
fetchData();
setInterval(fetchData,30000);
</script>
