<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARNET Finanzas — Tablero en vivo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#0d0f14;--s1:#141720;--s2:#1c2030;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);--tx:#e8eaf0;--mu:#7a7f94;--gr:#2dce89;--grd:rgba(45,206,137,.12);--rd:#f5365c;--rdd:rgba(245,54,92,.12);--bl:#4d9ef7;--am:#ffbe3d;--pu:#9b8ff7;--fh:'Syne',sans-serif;--fm:'DM Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--fm);min-height:100vh;padding:20px}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999}
.spinner{width:34px;height:34px;border:2px solid var(--bd2);border-top-color:var(--gr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{color:var(--mu);font-size:11px;letter-spacing:.08em}
#app{display:none}
.header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.header h1{font-family:var(--fh);font-size:20px;font-weight:700;letter-spacing:-.01em}
.header p{font-size:11px;color:var(--mu);margin-top:3px}
.live-badge{display:flex;align-items:center;gap:6px;background:var(--grd);border:1px solid rgba(45,206,137,.2);border-radius:20px;padding:4px 11px;font-size:10px;color:var(--gr)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--gr);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#last-upd{font-size:10px;color:var(--mu);margin-top:3px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:20px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.k-gr::before{background:var(--gr)}.kpi.k-rd::before{background:var(--rd)}.kpi.k-bl::before{background:var(--bl)}.kpi.k-am::before{background:var(--am)}.kpi.k-pu::before{background:var(--pu)}
.kpi-lbl{font-size:10px;color:var(--mu);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.kpi-v{font-family:var(--fh);font-size:20px;font-weight:700}
.kpi-v.pos{color:var(--gr)}.kpi-v.neg{color:var(--rd)}.kpi-v.blue{color:var(--bl)}
.kpi-s{font-size:10px;color:var(--mu);margin-top:3px}
.div{border:none;border-top:1px solid var(--bd);margin:18px 0}
.sec{font-family:var(--fh);font-size:10px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--bd)}
/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{font-size:11px;padding:4px 12px;border-radius:16px;cursor:pointer;border:1px solid var(--bd);color:var(--mu);background:transparent;font-family:var(--fm);transition:all .15s}
.tab.on{background:var(--s2);color:var(--tx);border-color:var(--bd2)}
/* BARS */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-lbl{font-size:10px;color:var(--mu);width:72px;flex-shrink:0;text-align:right}
.bar-track{flex:1;background:var(--s2);border-radius:3px;height:15px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-amt{font-size:10px;min-width:80px;text-align:right}
/* KANBAN */
.kscroll{overflow-x:auto;padding-bottom:6px}
.kanban{display:flex;gap:8px;min-width:600px}
.kcol{flex:1;min-width:110px}
.khead{font-size:10px;padding:5px 8px;background:var(--s2);border:1px solid var(--bd);border-radius:7px;margin-bottom:7px;display:flex;align-items:center;gap:5px;color:var(--mu)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.kcard{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;margin-bottom:6px;min-height:46px}
.kcard-r{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.kcard-a{font-family:var(--fh);font-size:13px;font-weight:700}
.kneto{border-radius:7px;padding:7px 10px;font-family:var(--fh);font-size:12px;font-weight:700;text-align:center;margin-top:3px}
/* CHART */
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ctrl label{font-size:10px;color:var(--mu)}
.ctrl input[type=date],.ctrl select{background:var(--s2);border:1px solid var(--bd2);color:var(--tx);border-radius:6px;padding:4px 8px;font-size:10px;font-family:var(--fm)}
.ctrl input[type=date]:focus,.ctrl select:focus{outline:none;border-color:var(--gr)}
.ctrl select option{background:var(--s2)}
.btn{background:transparent;border:1px solid var(--bd2);color:var(--tx);border-radius:6px;padding:4px 12px;font-size:10px;font-family:var(--fm);cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--gr);color:var(--gr)}
.cw{position:relative;width:100%;height:210px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.leg span{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mu)}
.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* TABLE */
.sr{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.sr input,.sr select{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:5px 9px;font-size:10px;font-family:var(--fm)}
.sr input{flex:1;min-width:140px}
.sr input:focus,.sr select:focus{outline:none;border-color:var(--gr)}
table{width:100%;border-collapse:collapse;font-size:10px}
thead th{color:var(--mu);font-weight:500;padding:6px 9px;border-bottom:1px solid var(--bd);text-align:left;text-transform:uppercase;letter-spacing:.06em}
tbody td{padding:6px 9px;border-bottom:1px solid var(--bd);color:var(--tx)}
tbody tr:hover td{background:var(--s2)}
tbody tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:20px;font-weight:500}
.t-i{background:rgba(45,206,137,.15);color:var(--gr)}
.t-b{background:rgba(77,158,247,.15);color:var(--bl)}
.t-s{background:rgba(155,143,247,.15);color:var(--pu)}
.t-p{background:rgba(255,190,61,.15);color:var(--am)}
.t-pa{background:rgba(245,54,92,.12);color:var(--rd)}
.t-o{background:rgba(122,127,148,.15);color:var(--mu)}
#nodata{font-size:11px;color:var(--mu);padding:1rem 0;display:none}
.footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer span{font-size:10px;color:var(--mu)}
.btnr{display:flex;align-items:center;gap:6px}
.btnr svg{transition:transform .4s}
.btnr:hover svg{transform:rotate(180deg)}
/* Trend badge */
.trend{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:500;margin-left:4px}
.trend.up{background:rgba(45,206,137,.15);color:var(--gr)}
.trend.dn{background:rgba(245,54,92,.12);color:var(--rd)}
</style>
</head>
<body>
<div id="loader"><div class="spinner"></div><p>Conectando con Drive...</p></div>
<div id="app">
  <div class="header">
    <div>
      <h1>ARNET Finanzas</h1>
      <p id="sub-p">May 2024 → Abr 2027 · Hoja activa en Drive</p>
      <div id="last-upd"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div class="live-badge"><div class="live-dot"></div>En vivo · 30s</div>
    </div>
  </div>

  <div class="kpi-grid" id="kpis"></div>

  <hr class="div">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <span style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em">Mes activo</span>
    <select id="mesSelect" onchange="changeMes()" style="background:var(--s2);border:1px solid var(--bd2);color:var(--tx);border-radius:6px;padding:4px 10px;font-size:11px;font-family:var(--fm)"></select>
  </div>
  <p class="sec">Flujo por rubro — <span id="sec-mes-bars"></span></p>
  <div id="bars"></div>

  <hr class="div">
  <p class="sec">Kanban semanal — <span id="sec-mes-kan"></span></p>
  <div class="kscroll"><div class="kanban" id="kanban"></div></div>

  <hr class="div">
  <p class="sec">Evolución histórica mensual</p>
  <div class="ctrl">
    <label>Vista</label>
    <select id="chartMode" onchange="renderChart()">
      <option value="acum">Acumulado</option>
      <option value="mes">Por mes</option>
    </select>
    <label>Rubro</label>
    <select id="chartRubro" onchange="renderChart()">
      <option value="Ingresos,Bajadas">Ingresos + Bajadas</option>
      <option value="Ingresos">Solo Ingresos</option>
      <option value="Bajadas">Solo Bajadas</option>
      <option value="neto">Resultado neto</option>
    </select>
    <label>Desde</label>
    <input type="date" id="dateFrom" value="2024-05-01">
    <label>Hasta</label>
    <input type="date" id="dateTo" value="2027-04-30">
    <button class="btn" onclick="renderChart()">Aplicar</button>
  </div>
  <div class="cw"><canvas id="lineChart"></canvas></div>
  <div class="leg" id="chartLeg"></div>

  <hr class="div">
  <p class="sec">Detalle de movimientos</p>
  <div class="sr">
    <input type="text" id="srch" placeholder="Buscar fecha, rubro..." oninput="renderTable()">
    <select id="fcat" onchange="renderTable()">
      <option value="">Todos los rubros</option>
      <option>Ingresos</option><option>Bajadas</option><option>Sueldos</option>
      <option>Publicidad</option><option>Panel</option><option>otros</option>
    </select>
    <select id="fyr" onchange="renderTable()">
      <option value="">Todos los años</option>
      <option value="2024">2024</option><option value="2025">2025</option>
      <option value="2026">2026</option>
    </select>
  </div>
  <table>
    <thead><tr><th>Mes</th><th>Rubro</th><th>Importe</th><th>Tipo</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="nodata">Sin resultados.</div>

  <div class="footer">
    <span id="fcnt"></span>
    <button class="btn btnr" onclick="fetchData()">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>Actualizar
    </button>
  </div>
</div>

  const liveMes = LIVE.length ? {y:LIVE[0].y, m:LIVE[0].m} : null;
  const base = liveMes
    ? HIST.filter(r=>!(r.y===liveMes.y && r.m===liveMes.m))
    : HIST;
  ALL = [...base, ...LIVE].sort((a,b)=>a.y!==b.y?a.y-b.y:a.m-b.m);
}

async function fetchData(){
  try{
    document.getElementById('loader').style.display='flex';
    document.getElementById('app').style.display='none';
    const res = await fetch(API);
    const json = await res.json();
    if(json.error) throw new Error(json.error);

    // Aggregate live rows into monthly totals by category
    const liveMap = {};
    json.rows.filter(r=>r.amt!==0).forEach(r=>{
      const k=`${r.y}_${r.m}_${r.cat}`;
      liveMap[k] = liveMap[k]||{y:r.y,m:r.m,cat:r.cat,amt:0};
      liveMap[k].amt += r.amt;
    });
    LIVE = Object.values(liveMap);

    const now = new Date(json.updated);
    document.getElementById('last-upd').textContent='Última sync: '+now.toLocaleString('es-AR');
    mergeData();
    render();
    document.getElementById('loader').style.display='none';
    document.getElementById('app').style.display='block';
  }catch(e){
    document.getElementById('loader').innerHTML=`<div style="color:var(--rd);font-size:12px;text-align:center;max-width:300px"><p style="font-size:22px;margin-bottom:8px">⚠</p><p>No se pudo conectar con Drive.</p><p style="color:var(--mu);font-size:10px;margin-top:5px">${e.message}</p><button class="btn" style="margin-top:12px" onclick="fetchData()">Reintentar</button></div>`;
  }
}

let SELECTED_MES = null; // {y,m} or null = auto

function getLatestMes(){
  const withIng=ALL.filter(r=>r.cat==='Ingresos'&&r.amt>0);
  if(!withIng.length)return{y:2026,m:5};
  return withIng.reduce((b,r)=>r.y>b.y||(r.y===b.y&&r.m>b.m)?{y:r.y,m:r.m}:b,{y:2000,m:1});
}

function getActiveMes(){
  return SELECTED_MES || getLatestMes();
}

function populateMesSelect(){
  const sel = document.getElementById('mesSelect');
  // Get all unique year-month combos from ALL data
  const mesSet = new Set();
  ALL.forEach(r => mesSet.add(r.y+'-'+String(r.m).padStart(2,'0')));
  const meses = [...mesSet].sort().reverse();
  const act = SELECTED_MES || getLatestMes();
  const actKey = act.y+'-'+String(act.m).padStart(2,'0');
  sel.innerHTML = meses.map(k=>{
    const [y,m]=k.split('-');
    return `<option value="${k}" ${k===actKey?'selected':''}>${MNAMES[parseInt(m)-1]} ${y}</option>`;
  }).join('');
}

function changeMes(){
  const val = document.getElementById('mesSelect').value;
  const [y,m] = val.split('-').map(Number);
  SELECTED_MES = {y,m};
  const act = {y,m};
  const prev = getPrevMes(act);
  const label = MNAMES[act.m-1]+' '+act.y;
  document.getElementById('sec-mes-bars').textContent=label;
  document.getElementById('sec-mes-kan').textContent=label;
  populateMesSelect();
  renderKPIs(act,prev);
  renderBars(getMesRows(act.y,act.m));
  renderKanban(getMesRows(act.y,act.m),act);
}

function getPrevMes(a){return a.m===1?{y:a.y-1,m:12}:{y:a.y,m:a.m-1};}
function getMesRows(y,m){return ALL.filter(r=>r.y===y&&r.m===m);}

function render(){
  const act=getActiveMes();
  const prev=getPrevMes(act);
  const label=MNAMES[act.m-1]+' '+act.y;
  document.querySelectorAll('.sec-mes').forEach(el=>el.textContent=label);
  document.getElementById('sec-mes-bars').textContent=label;
  document.getElementById('sec-mes-kan').textContent=label;
  document.getElementById('sub-p').textContent='May 2024 → Abr 2027 · Hoja activa en Drive';
  renderKPIs(act,prev);
  renderBars(getMesRows(act.y,act.m));
  renderKanban(getMesRows(act.y,act.m),act);
  renderChart();
  renderTable();
  document.getElementById('fcnt').textContent=ALL.length+' registros cargados · mes activo: '+label;
}

function renderKPIs(act,prev){
  const r=getMesRows(act.y,act.m);
  const rp=getMesRows(prev.y,prev.m);
  const ing=sumCat(r,'Ingresos'), baj=Math.abs(sumCat(r,'Bajadas'));
  const sue=sumCat(r,'Sueldos'), pub=sumCat(r,'Publicidad'), pan=sumCat(r,'Panel'), otr=sumCat(r,'otros');
  const gastoOp=sue+pub+pan+otr;
  const neto=ing+baj+gastoOp;
  const margen=ing>0?(baj/ing*100):0;
  // vs prev month
  const ingP=sumCat(rp,'Ingresos'), netoP=sumCat(rp,'Ingresos')+Math.abs(sumCat(rp,'Bajadas'))+sumCat(rp,'Sueldos')+sumCat(rp,'Publicidad')+sumCat(rp,'Panel')+sumCat(rp,'otros');
  const ingDelta=ingP>0?((ing-ingP)/ingP*100):0;
  const netoDelta=Math.abs(netoP)>0?((neto-netoP)/Math.abs(netoP)*100):0;

  document.getElementById('kpis').innerHTML=`
    <div class="kpi k-gr"><div class="kpi-lbl">Ingresos ${MSHORT[act.m-1]}</div><div class="kpi-v pos">${fmt(ing)}<span class="trend ${ingDelta>=0?'up':'dn'}">${ingDelta>=0?'↑':'↓'}${Math.abs(ingDelta).toFixed(1)}%</span></div><div class="kpi-s">vs ${MSHORT[prev.m-1]}: ${fmt(ingP)}</div></div>
    <div class="kpi k-bl"><div class="kpi-lbl">Bajadas · ganancia</div><div class="kpi-v blue">${fmt(baj)}</div><div class="kpi-s">${margen.toFixed(1)}% sobre ingresos</div></div>
    <div class="kpi k-pu"><div class="kpi-lbl">Sueldos</div><div class="kpi-v neg">${fmt(sue)}</div><div class="kpi-s">personal</div></div>
    <div class="kpi k-am"><div class="kpi-lbl">Publicidad</div><div class="kpi-v" style="color:var(--am)">${fmt(pub)}</div><div class="kpi-s">marketing</div></div>
    <div class="kpi k-rd"><div class="kpi-lbl">Panel + Otros</div><div class="kpi-v neg">${fmt(pan+otr)}</div><div class="kpi-s">infraestructura</div></div>
    <div class="kpi ${neto>=0?'k-gr':'k-rd'}"><div class="kpi-lbl">Resultado neto</div><div class="kpi-v ${neto>=0?'pos':'neg'}">${fmt(neto)}<span class="trend ${netoDelta>=0?'up':'dn'}">${netoDelta>=0?'↑':'↓'}${Math.abs(netoDelta).toFixed(1)}%</span></div><div class="kpi-s">ing+gcia−gastos</div></div>
  `;
}

function renderBars(rows){
  const vals=RUBROS.map(c=>({cat:c,val:sumCat(rows,c)})).filter(v=>v.val!==0);
  const maxA=Math.max(...vals.map(v=>Math.abs(v.val)));
  document.getElementById('bars').innerHTML=vals.map(({cat,val})=>{
    const isBaj=cat==='Bajadas';
    const disp=isBaj?Math.abs(val):val;
    return `<div class="bar-row">
      <span class="bar-lbl">${cat}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${maxA?(Math.abs(val)/maxA*100).toFixed(1):0}%;background:${BARCOL[cat]}"></div></div>
      <span class="bar-amt" style="color:${isBaj?'var(--bl)':disp>=0?'var(--gr)':'var(--rd)'}">${fmtFull(disp)}</span>
    </div>`;
  }).join('');
}

function buildWeeks(y,m){
  const yy=String(y).slice(-2), mm=String(m).padStart(2,'0');
  const dim=new Date(y,m,0).getDate();
  const ranges=[[1,7],[8,14],[15,21],[22,28]];
  if(dim>28)ranges.push([29,dim]);
  return ranges.map(([s,e])=>{
    const days=[];
    for(let d=s;d<=Math.min(e,dim);d++)days.push(`${String(d).padStart(2,'0')}/${mm}/${yy}`);
    return{lbl:`${s}–${Math.min(e,dim)}`,days};
  });
}

function renderKanban(rows,act){
  const weeks=buildWeeks(act.y,act.m);
  document.getElementById('kanban').innerHTML=weeks.map(w=>{
    const wv={};
    RUBROS.forEach(c=>wv[c]=0);
    // Check if rows have daily dates (d field like "01/06/26") or are monthly summaries
    const hasDailyData = rows.some(r=>r.d && /^\d{2}\/\d{2}\/\d{2}$/.test(r.d));
    if(hasDailyData){
      // Match daily rows to this week's days
      const wr=rows.filter(r=>{
        if(!r.d) return false;
        const dayNum = parseInt(r.d.split('/')[0]);
        const[s,e]=w.lbl.split('–').map(Number);
        return dayNum>=s && dayNum<=e;
      });
      wr.forEach(r=>{if(wv[r.cat]!==undefined)wv[r.cat]+=r.amt;});
    } else {
      // Monthly summary — show total only in week 1
      if(w.lbl.startsWith('1')){
        RUBROS.forEach(c=>wv[c]=sumCat(rows,c));
      }
    }
    const ing=wv['Ingresos'],baj=Math.abs(wv['Bajadas']);
    const gastoOp=RUBROS.filter(c=>c!=='Ingresos'&&c!=='Bajadas').reduce((s,c)=>s+wv[c],0);
    const neto=ing+baj+gastoOp;
    return `<div class="kcol">
      <div class="khead"><span class="dot" style="background:${neto>=0?'#2dce89':'#f5365c'}"></span><span>${w.lbl}</span></div>
      ${RUBROS.map(cat=>{
        const v=wv[cat],isBaj=cat==='Bajadas',disp=isBaj?Math.abs(v):v;
        const col=isBaj?'var(--bl)':v>=0?'var(--gr)':'var(--rd)';
        if(!v)return`<div class="kcard" style="opacity:.25"><div class="kcard-r">${cat}</div><div class="kcard-a" style="color:var(--mu)">—</div></div>`;
        return`<div class="kcard"><div class="kcard-r">${cat}${isBaj?' ✓':''}</div><div class="kcard-a" style="color:${col}">${fmt(disp)}</div></div>`;
      }).join('')}
      <div class="kneto" style="background:${neto>=0?'rgba(45,206,137,.08)':'rgba(245,54,92,.08)'};border:1px solid ${neto>=0?'rgba(45,206,137,.2)':'rgba(245,54,92,.2)'};color:${neto>=0?'var(--gr)':'var(--rd)'}">
        ${fmt(neto)}
      </div>
    </div>`;
  }).join('');
}

function renderChart(){
  const from=new Date(document.getElementById('dateFrom').value);
  const to=new Date(document.getElementById('dateTo').value);
  to.setHours(23,59,59);
  const mode=document.getElementById('chartMode').value;
  const rubro=document.getElementById('chartRubro').value;

  const filtered=ALL.filter(r=>{
    const dt=new Date(r.y,r.m-1,1);
    return dt>=from&&dt<=to;
  });
  const mkeys=[...new Set(filtered.map(r=>`${r.y}-${String(r.m).padStart(2,'0')}`))].sort();

  const datasets=[];
  const addDs=(label,color,dash,data)=>datasets.push({label,data,borderColor:color,backgroundColor:color.replace(')',', .08)').replace('rgb','rgba'),fill:true,tension:.35,pointRadius:3,pointBackgroundColor:color,borderWidth:2,borderDash:dash});

  if(rubro==='neto'){
    let cum=0;
    const d=mkeys.map(mk=>{
      const[y,m]=mk.split('-').map(Number);
      const mr=filtered.filter(r=>r.y===y&&r.m===m);
      const ing=sumCat(mr,'Ingresos'),baj=Math.abs(sumCat(mr,'Bajadas'));
      const gasto=RUBROS.filter(c=>c!=='Ingresos'&&c!=='Bajadas').reduce((s,c)=>s+sumCat(mr,c),0);
      const n=ing+baj+gasto;
      if(mode==='acum'){cum+=n;return Math.round(cum/1e6*100)/100;}
      return Math.round(n/1e6*100)/100;
    });
    addDs('Resultado neto','#2dce89',[],d);
  } else {
    const rubros=rubro.split(',');
    const colors={Ingresos:'#2dce89',Bajadas:'#4d9ef7'};
    rubros.forEach(rb=>{
      let cum=0;
      const d=mkeys.map(mk=>{
        const[y,m]=mk.split('-').map(Number);
        const mr=filtered.filter(r=>r.y===y&&r.m===m);
        const v=rb==='Bajadas'?Math.abs(sumCat(mr,rb)):sumCat(mr,rb);
        if(mode==='acum'){cum+=v;return Math.round(cum/1e6*100)/100;}
        return Math.round(v/1e6*100)/100;
      });
      addDs(rb,colors[rb],rb==='Bajadas'?[5,4]:[],d);
    });
  }

  const labels=mkeys.map(k=>{const[y,m]=k.split('-');return MSHORT[parseInt(m)-1]+' '+y.slice(2);});
  if(lineChart)lineChart.destroy();
  lineChart=new Chart(document.getElementById('lineChart'),{
    type:'line',data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toFixed(2)+'M'}}},
      scales:{
        x:{ticks:{color:'#7a7f94',font:{size:9,family:'DM Mono'},autoSkip:true,maxTicksLimit:18,maxRotation:45},grid:{display:false},border:{color:'rgba(255,255,255,.07)'}},
        y:{ticks:{color:'#7a7f94',font:{size:9,family:'DM Mono'},callback:v=>'$'+v+'M'},grid:{color:'rgba(255,255,255,.05)'},border:{display:false}}
      }
    }
  });
  document.getElementById('chartLeg').innerHTML=datasets.map(ds=>`<span><span class="ld" style="background:${ds.borderColor}"></span>${ds.label} ${mode==='acum'?'(acum.)':'por mes'}</span>`).join('');
}

function renderTable(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const cat=document.getElementById('fcat').value;
  const yr=document.getElementById('fyr').value;
  const rows=[...ALL].reverse().filter(r=>{
    const mc=!cat||r.cat===cat;
    const my=!yr||String(r.y)===yr;
    const mq=!q||String(r.m).padStart(2,'0')+'/'+r.y===q||r.cat.toLowerCase().includes(q)||MNAMES[r.m-1].toLowerCase().includes(q);
    return mc&&my&&mq;
  });
  document.getElementById('nodata').style.display=rows.length?'none':'block';
  document.getElementById('tbody').innerHTML=rows.map(r=>{
    const isBaj=r.cat==='Bajadas',disp=isBaj?Math.abs(r.amt):r.amt;
    const col=isBaj?'var(--bl)':disp>=0?'var(--gr)':'var(--rd)';
    const tipo=ALL.filter(x=>x.y===r.y&&x.m===r.m&&x.cat===r.cat).length===1&&r.d?'diario':'resumen';
    return`<tr>
      <td style="white-space:nowrap">${MSHORT[r.m-1]} ${r.y}</td>
      <td><span class="tag ${TAGCLS[r.cat]}">${r.cat}${isBaj?' ✓':''}</span></td>
      <td style="color:${col};font-weight:500">${fmtFull(disp)}</td>
      <td style="color:var(--mu)">${tipo}</td>
    </tr>`;
  }).join('');
}

fetchData();
setInterval(fetchData, 30000);
</script>
