<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARNET Finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f14;color:#e8eaf0;font-family:'DM Mono',monospace;padding:18px;min-height:100vh}
h1{font-family:'Syne',sans-serif;font-size:19px;font-weight:700}
.sub{font-size:11px;color:#7a7f94;margin-top:2px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.badge{display:flex;align-items:center;gap:6px;background:rgba(45,206,137,.12);border:1px solid rgba(45,206,137,.2);border-radius:20px;padding:4px 11px;font-size:10px;color:#2dce89}
.pulse{width:6px;height:6px;border-radius:50%;background:#2dce89;animation:p 2s ease infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
#loader{position:fixed;inset:0;background:#0d0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99}
.spin{width:34px;height:34px;border:2px solid rgba(255,255,255,.1);border-top-color:#2dce89;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-bottom:18px}
.kpi{background:#141720;border-radius:8px;padding:10px 12px;border-top:2px solid transparent}
.klbl{font-size:9px;color:#7a7f94;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.kval{font-family:'Syne',sans-serif;font-size:18px;font-weight:700}
.kval.g{color:#2dce89}.kval.r{color:#f5365c}.kval.b{color:#4d9ef7}
.ksub{font-size:9px;color:#7a7f94;margin-top:2px}
.tr{font-size:9px;padding:1px 4px;border-radius:6px;margin-left:3px}
.tru{background:rgba(45,206,137,.15);color:#2dce89}.trd{background:rgba(245,54,92,.12);color:#f5365c}
.div{border:none;border-top:1px solid rgba(255,255,255,.07);margin:14px 0}
.sec{font-size:10px;font-weight:500;color:#7a7f94;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ctrl label{font-size:10px;color:#7a7f94}
select,button{background:#1c2030;border:1px solid rgba(255,255,255,.13);color:#e8eaf0;border-radius:6px;padding:4px 8px;font-size:11px;font-family:'DM Mono',monospace;cursor:pointer}
button:hover{border-color:#2dce89;color:#2dce89}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.blbl{font-size:10px;color:#7a7f94;width:68px;text-align:right;flex-shrink:0}
.btrack{flex:1;background:#1c2030;border-radius:3px;height:13px;overflow:hidden}
.bfill{height:100%;border-radius:3px}
.bamt{font-size:10px;min-width:82px;text-align:right}
.kscroll{overflow-x:auto;padding-bottom:4px}
.kanban{display:flex;gap:7px;min-width:520px}
.kcol{flex:1;min-width:95px}
.khead{font-size:10px;padding:4px 7px;background:#1c2030;border:1px solid rgba(255,255,255,.07);border-radius:6px;margin-bottom:5px;display:flex;align-items:center;gap:4px;color:#7a7f94}
.kdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.kcard{background:#141720;border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:6px 8px;margin-bottom:5px}
.kcard.em{opacity:.2}
.krub{font-size:9px;color:#7a7f94;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.kamt{font-family:'Syne',sans-serif;font-size:12px;font-weight:700}
.kneto{border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700;text-align:center;margin-top:3px}
.cw{position:relative;width:100%;height:220px}
.foot{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.foot span{font-size:10px;color:#7a7f94}
</style>
</head>
<body>

<div id="loader">
  <div class="spin"></div>
  <p style="font-size:11px;color:#7a7f94;letter-spacing:.08em">Conectando con Drive...</p>
</div>

<div id="app">
  <div class="topbar">
    <div>
      <h1>ARNET Finanzas</h1>
      <div class="sub">May 2024 → actual · datos en vivo desde Drive</div>
      <div class="sub" id="sync" style="margin-top:2px"></div>
    </div>
    <div class="badge"><div class="pulse"></div>En vivo</div>
  </div>

  <div class="kgrid" id="kpis"></div>

  <hr class="div">
  <div class="ctrl">
    <label>Mes activo</label>
    <select id="selMes" onchange="changeMes()"></select>
  </div>
  <div class="sec">Flujo por rubro — <span id="titBars" style="color:#e8eaf0;margin-left:3px"></span></div>
  <div id="bars"></div>

  <hr class="div">
  <div class="sec">Kanban semanal — <span id="titKan" style="color:#e8eaf0;margin-left:3px"></span></div>
  <div class="kscroll"><div class="kanban" id="kanban"></div></div>

  <hr class="div">
  <div class="sec">Ingreso promedio diario por mes</div>
  <div class="cw"><canvas id="chart" role="img" aria-label="Ingreso promedio diario por mes"></canvas></div>

  <div class="foot">
    <span id="fcnt"></span>
    <button onclick="fetchData()">↻ Actualizar</button>
  </div>
</div>

<script>
var API = "https://script.google.com/macros/s/AKfycbwnjZjvGoVv348RTy1E-uRd5Wx7r-6gqmic0EFbsHp_sllEpUhIaz3d4B_cqjyj7h-E2g/exec";
var MN = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var MS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var RUB = ['Ingresos','Bajadas','Sueldos','Publicidad','Panel','otros'];
var BC  = {Ingresos:'#2dce89',Bajadas:'#4d9ef7',Sueldos:'#9b8ff7',Publicidad:'#ffbe3d',Panel:'#f5365c',otros:'#5a5f72'};

var ALL = [];
var MONTH_DAYS = {};
var SEL = null;
var lineChart = null;

function f(n){var a=Math.abs(n);if(a>=1000000)return(n<0?'-':'')+'$'+(a/1e6).toFixed(2)+'M';if(a>=1000)return(n<0?'-':'')+'$'+Math.round(a/1000)+'K';return(n<0?'-':'')+'$'+Math.round(a);}
function ff(n){return(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');}
function sc(rows,cat){return rows.filter(function(r){return r.cat===cat;}).reduce(function(s,r){return s+r.amt;},0);}
function gm(y,m){return ALL.filter(function(r){return r.y===y&&r.m===m;});}
function pm(y,m){return m===1?{y:y-1,m:12}:{y:y,m:m-1};}

function latest(){
  var best={y:2024,m:5},seen={};
  ALL.forEach(function(r){
    var k=r.y+'_'+r.m;
    if(!seen[k]&&r.cat==='Ingresos'&&r.amt>0){
      seen[k]=true;
      if(r.y>best.y||(r.y===best.y&&r.m>best.m)) best={y:r.y,m:r.m};
    }
  });
  return best;
}
function active(){return SEL||latest();}

async function fetchData(){
  try{
    document.getElementById('loader').style.display='flex';
    document.getElementById('app').style.display='none';

    var res = await fetch(API);
    var json = await res.json();
    if(json.error) throw new Error(json.error);

    ALL = json.rows;
    MONTH_DAYS = json.monthDays||{};

    var d = new Date(json.updated);
    document.getElementById('sync').textContent = 'Sync: '+d.toLocaleString('es-AR');

    render();
    document.getElementById('loader').style.display='none';
    document.getElementById('app').style.display='block';
  } catch(e){
    document.getElementById('loader').innerHTML =
      '<div style="color:#f5365c;text-align:center;max-width:300px">' +
      '<p style="font-size:22px;margin-bottom:8px">⚠</p>' +
      '<p style="font-size:12px">'+e.message+'</p>' +
      '<button onclick="fetchData()" style="margin-top:12px">Reintentar</button></div>';
  }
}

function render(){
  var act = active();
  // Build selector
  var seen={}, meses=[];
  ALL.forEach(function(r){
    var k=r.y+'-'+(r.m<10?'0':'')+r.m;
    if(!seen[k]){seen[k]=true;meses.push({k:k,y:r.y,m:r.m});}
  });
  meses.sort(function(a,b){return b.y!==a.y?b.y-a.y:b.m-a.m;});
  var ak=act.y+'-'+(act.m<10?'0':'')+act.m, h='';
  meses.forEach(function(x){
    h+='<option value="'+x.k+'"'+(x.k===ak?' selected':'')+'>'+MN[x.m-1]+' '+x.y+'</option>';
  });
  document.getElementById('selMes').innerHTML=h;

  buildAll(act);
  buildChart();
  document.getElementById('fcnt').textContent = ALL.length+' registros cargados desde Drive';
}

function changeMes(){
  var v=document.getElementById('selMes').value, p=v.split('-');
  SEL={y:+p[0],m:+p[1]};
  buildAll(SEL);
}

function buildAll(act){
  buildKPIs(act);
  buildBars(act);
  buildKanban(act);
}

function buildKPIs(act){
  var r=gm(act.y,act.m), pv=pm(act.y,act.m), rp=gm(pv.y,pv.m);
  var ing=sc(r,'Ingresos'), baj=Math.abs(sc(r,'Bajadas'));
  var sue=sc(r,'Sueldos'), pub=sc(r,'Publicidad'), pan=sc(r,'Panel'), otr=sc(r,'otros');
  var neto=ing+baj+sue+pub+pan+otr;
  var margen=ing>0?Math.round(baj/ing*1000)/10:0;
  var ingP=sc(rp,'Ingresos');
  var netoP=sc(rp,'Ingresos')+Math.abs(sc(rp,'Bajadas'))+sc(rp,'Sueldos')+sc(rp,'Publicidad')+sc(rp,'Panel')+sc(rp,'otros');
  var di=ingP>0?Math.round((ing-ingP)/ingP*1000)/10:0;
  var dn=Math.abs(netoP)>0?Math.round((neto-netoP)/Math.abs(netoP)*1000)/10:0;

  function kk(bc,lb,val,vc,d,s){
    var t=d!==null?'<span class="tr '+(d>=0?'tru':'trd')+'">'+(d>=0?'↑':'↓')+Math.abs(d)+'%</span>':'';
    return '<div class="kpi" style="border-top-color:'+bc+'">'+
           '<div class="klbl">'+lb+'</div>'+
           '<div class="kval '+vc+'">'+val+t+'</div>'+
           '<div class="ksub">'+s+'</div></div>';
  }
  document.getElementById('kpis').innerHTML =
    kk('#2dce89','Ingresos '+MS[act.m-1]+' '+act.y,f(ing),'g',di,'vs '+MS[pv.m-1]+': '+f(ingP))+
    kk('#4d9ef7','Bajadas · ganancia',f(baj),'b',null,margen+'% s/ingresos')+
    kk('#9b8ff7','Sueldos',f(sue),'r',null,'personal')+
    kk('#ffbe3d','Publicidad',f(pub),pub>=0?'g':'r',null,'marketing')+
    kk('#f5365c','Panel + Otros',f(pan+otr),'r',null,'infraestructura')+
    kk(neto>=0?'#2dce89':'#f5365c','Resultado neto',f(neto),neto>=0?'g':'r',dn,'ing+gcia-gastos');
}

function buildBars(act){
  document.getElementById('titBars').textContent=MN[act.m-1]+' '+act.y;
  var r=gm(act.y,act.m), vals=[], mx=0;
  RUB.forEach(function(c){
    var v=sc(r,c);
    if(v!==0){vals.push({cat:c,val:v});if(Math.abs(v)>mx)mx=Math.abs(v);}
  });
  var h='';
  vals.forEach(function(x){
    var iB=x.cat==='Bajadas', d=iB?Math.abs(x.val):x.val;
    var col=iB?'#4d9ef7':d>=0?'#2dce89':'#f5365c';
    var pct=mx?Math.round(Math.abs(x.val)/mx*1000)/10:0;
    h+='<div class="brow">'+
       '<span class="blbl">'+x.cat+'</span>'+
       '<div class="btrack"><div class="bfill" style="width:'+pct+'%;background:'+BC[x.cat]+'"></div></div>'+
       '<span class="bamt" style="color:'+col+'">'+ff(d)+'</span></div>';
  });
  document.getElementById('bars').innerHTML=h;
}

function buildKanban(act){
  document.getElementById('titKan').textContent=MN[act.m-1]+' '+act.y;
  var dim=new Date(act.y,act.m,0).getDate();
  var ranges=[[1,7],[8,14],[15,21],[22,28]];
  if(dim>28) ranges.push([29,dim]);
  var daily=ALL.filter(function(r){return r.y===act.y&&r.m===act.m;});
  var h='';
  ranges.forEach(function(rng){
    var s=rng[0], e=Math.min(rng[1],dim), wv={};
    RUB.forEach(function(c){wv[c]=0;});
    daily.forEach(function(r){if(r.d>=s&&r.d<=e&&wv[r.cat]!==undefined) wv[r.cat]+=r.amt;});
    var ing=wv['Ingresos'], baj=Math.abs(wv['Bajadas']);
    var neto=ing+baj+wv['Sueldos']+wv['Publicidad']+wv['Panel']+wv['otros'];
    var hasD=RUB.some(function(c){return wv[c]!==0;});
    var dc=hasD?(neto>=0?'#2dce89':'#f5365c'):'#5a5f72';
    h+='<div class="kcol"><div class="khead"><span class="kdot" style="background:'+dc+'"></span>'+s+'–'+e+'</div>';
    RUB.forEach(function(cat){
      var v=wv[cat], iB=cat==='Bajadas', d=iB?Math.abs(v):v;
      var col=iB?'#4d9ef7':v>=0?'#2dce89':'#f5365c';
      if(!v) h+='<div class="kcard em"><div class="krub">'+cat+'</div><div class="kamt" style="color:#5a5f72">—</div></div>';
      else   h+='<div class="kcard"><div class="krub">'+cat+(iB?' ✓':'')+'</div><div class="kamt" style="color:'+col+'">'+f(d)+'</div></div>';
    });
    if(hasD) h+='<div class="kneto" style="background:'+(neto>=0?'rgba(45,206,137,.08)':'rgba(245,54,92,.08)')+
      ';border:1px solid '+(neto>=0?'rgba(45,206,137,.2)':'rgba(245,54,92,.2)')+
      ';color:'+(neto>=0?'#2dce89':'#f5365c')+'">'+f(neto)+'</div>';
    h+='</div>';
  });
  document.getElementById('kanban').innerHTML=h;
}

function buildChart(){
  // Get unique months sorted
  var seen={}, mkeys=[];
  ALL.forEach(function(r){
    var k=r.y+'_'+r.m;
    if(!seen[k]){seen[k]=true;mkeys.push({y:r.y,m:r.m});}
  });
  mkeys.sort(function(a,b){return a.y!==b.y?a.y-b.y:a.m-b.m;});

  var labels=[], data=[];
  mkeys.forEach(function(mk){
    var rows=gm(mk.y,mk.m);
    var totalIng=sc(rows,'Ingresos');
    if(totalIng<=0) return;

    // Days: use monthDays from server (handles partial months)
    var key=mk.y+'_'+mk.m;
    var days=MONTH_DAYS[key]||new Date(mk.y,mk.m,0).getDate();
    var avg=Math.round(totalIng/days);

    labels.push(MS[mk.m-1]+' '+String(mk.y).slice(2));
    data.push(Math.round(avg/1000)); // in K
  });

  if(lineChart) lineChart.destroy();
  lineChart=new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{
      labels:labels,
      datasets:[{
        label:'Promedio diario ($K)',
        data:data,
        backgroundColor:'rgba(45,206,137,.25)',
        borderColor:'#2dce89',
        borderWidth:1.5,
        borderRadius:3
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(c){return '$'+c.parsed.y.toLocaleString('es-AR')+'K/día';}}}
      },
      scales:{
        x:{ticks:{color:'#7a7f94',font:{size:9},autoSkip:true,maxTicksLimit:20,maxRotation:45},grid:{display:false},border:{color:'rgba(255,255,255,.07)'}},
        y:{ticks:{color:'#7a7f94',font:{size:9},callback:function(v){return '$'+v+'K';}},grid:{color:'rgba(255,255,255,.05)'},border:{display:false}}
      }
    }
  });
}

// Load on start, refresh every 5 minutes
fetchData();
setInterval(fetchData, 300000);
</script>
</body>
</html>
